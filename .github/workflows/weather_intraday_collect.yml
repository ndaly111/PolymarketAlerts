name: Weather - Collect Intraday Observations

on:
  schedule:
    # Every 30 minutes during US market hours (10 UTC to 01 UTC = 5am-8pm ET)
    - cron: "0,30 10-23 * * *"
    - cron: "0,30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-intraday-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
      WEATHER_DB_PATH: weather/data/weather_forecast_accuracy.db
      NWS_USER_AGENT: "weather-edge-bot/0.1 (contact: ${{ secrets.NWS_CONTACT_EMAIL || 'you@example.com' }})"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Weather setup
        uses: ./.github/actions/weather_setup
        with:
          python-version: "3.11"
          install-root-requirements: "true"

      - name: Collect intraday observations
        run: |
          python -m weather.scripts.collect_intraday_observations \
            --db "$WEATHER_DB_PATH"

      - name: Prune and commit DB (if changed and under 95MB)
        run: |
          if [[ -n "$(git status --porcelain "$WEATHER_DB_PATH")" ]]; then
            python -m weather.scripts.prune_db --db "$WEATHER_DB_PATH" --keep-years 5
            DB_SIZE=$(stat -c%s "$WEATHER_DB_PATH")
            MAX_SIZE=$((95 * 1048576))
            if [[ $DB_SIZE -gt $MAX_SIZE ]]; then
              echo "WARNING: DB is $(( DB_SIZE / 1048576 )) MB — over 95MB limit, skipping commit."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$WEATHER_DB_PATH"
              git commit -m "weather: collect intraday observations"
              for i in 1 2 3; do
                git pull --rebase && git push && break
                echo "Push attempt $i failed, retrying..."
                sleep 2
              done
            fi
          else
            echo "No DB changes to commit."
          fi
